# Deploy the Angular app whenever changes are pushed to main
name: Deploy Angular app to GitHub Pages

on:
  push:
    branches:
      - main

# Permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Get the latest version of the code
      - name: Checkout
        uses: actions/checkout@v4

      # Set up Node.js and enable npm dependency caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install the dependencies from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Build Angular for the GitHub Pages subdirectory
      - name: Build Angular app
        run: npm run build -- --base-href /site-vitrine/

      # Configure GitHub Pages for the deployment
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Upload the built Angular files as the Pages deployment artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/site-vitrine/browser

      # Publish the artifact to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4