<div class="contact-confirmation">
  <svg class="contact-confirmation__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="10" />
    <path d="m8 12.5 2.5 2.5L16 9.5" />
  </svg>

  <h2 #title class="title2 contact-confirmation__title" tabindex="-1">
    {{ 'contact.confirmation.title' | translate }}
  </h2>

  <p class="body">{{ 'contact.confirmation.body' | translate }}</p>

  <button class="contact-confirmation__action" type="button" (click)="newMessage.emit()">
    {{ 'contact.confirmation.action' | translate }}
  </button>
</div>
