<div class="preview__section">
    <div class="preview__container">
        <div class="preview__image-wrapper">
            <img class="preview__image" src="icons/icone-contact.svg" alt="">
        </div>
        <div class="preview__content">
            <div class="preview__text">
                <p class="title1">{{'home.contact.title' | translate }}</p>
                <p class="body">{{'home.contact.body' | translate }}</p>
                <p class="body">{{'home.contact.availability' | translate }}</p>
            </div>
            <app-button [routerLink]="routes.contact" color="secondary">
                {{'home.contact.get-in-touch' | translate}}
            </app-button>
        </div>
    </div>
</div>
