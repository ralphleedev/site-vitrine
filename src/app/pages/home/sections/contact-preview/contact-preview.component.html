<div class="band band--section theme-primary">
    <div class="band__container band__container--reverse">
        <div class="image-wrapper">
            <img class="image" src="icons/icone-contact.svg" alt="">
        </div>
        <div class="band__content">
            <p class="title1">{{'home.contact.title' | translate }}</p>
            <p class="body">{{'home.contact.body' | translate }}</p>
            <p class="body">{{'home.contact.availability' | translate }}</p>
            <app-button class="band__button" [routerLink]="routes.contact" color="secondary">
                {{'home.contact.get-in-touch' | translate}}
            </app-button>
        </div>
    </div>
</div>
